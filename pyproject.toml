[project]
name = "kflow"
version = "1.0.0"
description = "Knowledge Flow — DAG-based knowledge topology management CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14,<0.16", "setuptools>=75"]

[project.scripts]
kflow = "kflow.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"kflow.human" = ["static/index.html", "static/assets/*"]

[tool.setuptools.packages.find]
include = ["kflow*"]
